ame: Node.js CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # JOB 1: TEST JOB (Runs on GitHub's hosted runner)
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests and capture results
        run: |
          mkdir -p test-results
          npm test > test-results/results.txt 2>&1 || true
          cat test-results/results.txt

      - name: Upload test results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results-artifact
          path: test-results/results.txt

  # ----------------------------------------------------
  # JOB 2: DEPLOY JOB (Runs on your self-hosted runner)
  # ----------------------------------------------------
  deploy:
    needs: test
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download test results artifact
        uses: actions/download-artifact@v4
        with:
          name: test-results-artifact
          path: downloaded-results

      - name: Display test results artifact content
        run: |
          echo "=== Test Results Artifact Output ==="
          cat downloaded-results/results.txt

      - name: Install production dependencies
        run: npm ci --only=production

      - name: Deploy application with PM2
        run: |
          export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(node -v 2>/dev/null)/bin:~/.npm-global/bin
          npx pm2 delete node-app || true
          npx pm2 start app.js --name "node-app"
          npx pm2 save